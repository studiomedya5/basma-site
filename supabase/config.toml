
[functions.meta-capi-purchase]
enabled = true
# On vérifie nous-mêmes un secret partagé (x-webhook-secret) → pas de JWT requis.
verify_jwt = false
import_map = "./functions/meta-capi-purchase/deno.json"
entrypoint = "./functions/meta-capi-purchase/index.ts"

[functions.send-order-email]
enabled = true
verify_jwt = true
import_map = "./functions/send-order-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-order-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-order-email/*.html" ]
